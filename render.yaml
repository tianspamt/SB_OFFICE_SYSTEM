# Render Blueprint for the backend API (Dashboard -> New -> Blueprint).
# Values marked sync: false are secrets — Render asks for them on first deploy.
services:
  - type: web
    name: sb-balilihan-api
    runtime: node
    rootDir: my-backend
    region: singapore
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: TZ
        value: Asia/Manila
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      # The Vercel site address, no trailing slash (CORS + password-reset links)
      - key: FRONTEND_URL
        sync: false
      # Optional: extra allowed site addresses, comma-separated (e.g. a custom domain)
      - key: CORS_ORIGINS
        sync: false
      # Optional: public URL of the municipal seal on printed resolutions
      - key: LOGO_URL
        sync: false
